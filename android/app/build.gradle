apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'my.boxman'
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 9
        versionName "9.99u3"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            // 暂时沿用 debug 签名；正式发布前替换为 CI keystore。
            signingConfig signingConfigs.debug
        }
    }
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.each { output ->
                //这里修改apk文件名:
                output.outputFileName.set("BoxMan${output.versionName.get()}_${releaseTime()}.apk")
            }
        }
    }
    productFlavors {
    }
    useLibrary 'org.apache.http.legacy'   //解决导入org.apache问题
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
    namespace 'my.boxman'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

def releaseTime() {
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'my.boxman:boxman-core'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.15.0'
}